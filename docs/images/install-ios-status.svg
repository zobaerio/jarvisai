<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
<title id="title">J.A.R.V.I.S iPhone and iPad availability</title><desc id="desc">The project currently has no signed iOS IPA, TestFlight invitation, or App Store listing. A no-code-sign build check is not installable on a device.</desc>
<rect width="1200" height="320" rx="24" fill="#0b1220"/><rect x="40" y="40" width="1120" height="240" rx="20" fill="#17243a" stroke="#475569" stroke-width="2"/><rect x="75" y="75" width="120" height="170" rx="20" fill="#0b1220" stroke="#93a4ba" stroke-width="4"/><rect x="89" y="94" width="92" height="130" rx="9" fill="#1e293b"/><circle cx="135" cy="235" r="4" fill="#93a4ba"/><g font-family="Arial,sans-serif"><text x="230" y="95" font-size="29" font-weight="700" fill="#fff">iPhone / iPad — iOS status</text><rect x="230" y="116" width="255" height="36" rx="18" fill="#7f1d1d"/><text x="357" y="140" text-anchor="middle" font-size="16" font-weight="700" fill="#fecaca">NOT INSTALLABLE YET</text><text x="230" y="185" font-size="19" fill="#d2deef">A no-code-sign CI check is available, but no signed IPA,</text><text x="230" y="214" font-size="19" fill="#d2deef">TestFlight invitation, or App Store release exists yet.</text><text x="230" y="250" font-size="16" fill="#93c5fd">Please wait for an official signed release before attempting installation.</text></g></svg>