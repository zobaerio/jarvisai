name: Windows Installer Package

on:
  pull_request:
    paths:
      - "Zobaerio-Jarvis-AI/**"
      - ".github/workflows/windows-installer-build.yml"
  push:
    branches: [main]
    paths:
      - "Zobaerio-Jarvis-AI/**"
      - ".github/workflows/windows-installer-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-installer:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.12 x64
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: Build the application payload
        shell: cmd
        working-directory: Zobaerio-Jarvis-AI
        run: build_portable.bat

      - name: Install Inno Setup compiler
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Compile per-user Windows installer
        shell: pwsh
        working-directory: Zobaerio-Jarvis-AI
        run: |
          $version = & ".packaging-venv/Scripts/python.exe" -c "from jarvis.version import APP_VERSION; print(APP_VERSION)"
          if ($LASTEXITCODE -ne 0 -or !$version.Trim()) { throw "Could not read app version from source." }
          $compiler = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) { throw "Inno Setup compiler was not found at $compiler." }
          & $compiler "/DMyAppVersion=$($version.Trim())" "installer.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed." }

      - name: Verify installer output and embedded payload
        shell: pwsh
        working-directory: Zobaerio-Jarvis-AI
        run: |
          $installer = "dist/JARVIS-Setup.exe"
          if (!(Test-Path $installer)) { throw "The Windows installer executable was not produced." }
          if ((Get-Item $installer).Length -lt 10MB) { throw "Installer unexpectedly looks too small." }
          if (!(Test-Path "dist/JARVIS/JARVIS.exe")) { throw "The app payload is missing." }
          if (!(Test-Path "dist/JARVIS/_internal/assets/avatar_studio.html")) { throw "The 3D Studio payload is missing." }
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          $version = & ".packaging-venv/Scripts/python.exe" -c "from jarvis.version import APP_VERSION; print(APP_VERSION)"
          "J.A.R.V.I.S installer verified"
          "Version: $($version.Trim())"
          "Size bytes: $((Get-Item $installer).Length)"
          "SHA256: $hash"

      - name: Smoke-test install, launch, and uninstall
        shell: pwsh
        working-directory: Zobaerio-Jarvis-AI
        run: |
          $installer = (Resolve-Path "dist/JARVIS-Setup.exe").Path
          $installDir = Join-Path $env:LOCALAPPDATA "Programs/Zobaerio/JARVIS"
          $appExe = Join-Path $installDir "JARVIS.exe"
          $userDataDir = Join-Path $env:APPDATA "Zobaerio/Jarvis"
          $sentinel = Join-Path $userDataDir "installer-smoke-test-preserve.txt"

          $install = Start-Process -FilePath $installer -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Silent installer exited with code $($install.ExitCode)." }
          if (!(Test-Path $appExe)) { throw "Installed JARVIS.exe was not found." }
          if (!(Test-Path (Join-Path $installDir "_internal/assets/avatar_studio.html"))) { throw "Installed 3D Studio asset is missing." }

          $app = Start-Process -FilePath $appExe -WorkingDirectory $installDir -PassThru
          Start-Sleep -Seconds 5
          $app.Refresh()
          if ($app.HasExited) { throw "Installed app exited during the startup smoke test (code $($app.ExitCode))." }
          Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 1

          New-Item -ItemType Directory -Path $userDataDir -Force | Out-Null
          Set-Content -LiteralPath $sentinel -Value "preserve-user-data" -Encoding ascii
          $uninstaller = Join-Path $installDir "unins000.exe"
          if (!(Test-Path $uninstaller)) { throw "Inno Setup uninstaller was not installed." }
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART") -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Silent uninstaller exited with code $($uninstall.ExitCode)." }
          if (Test-Path $appExe) { throw "Application executable remains after uninstall." }
          if (!(Test-Path $sentinel)) { throw "Uninstall removed user data that should be preserved." }
          Remove-Item -LiteralPath $sentinel -Force
          "Installer smoke test passed: install, launch, uninstall, and user-data preservation."
      - name: Upload unsigned Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Windows-Installer
          path: Zobaerio-Jarvis-AI/dist/JARVIS-Setup.exe
          if-no-files-found: error
          retention-days: 90
