name: Mobile Build Validation

on:
  workflow_call:
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-build.yml"
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug-apk:
    name: Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android host project
        working-directory: mobile
        run: python3 bootstrap_platforms.py
      - name: Resolve dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Analyze Dart source
        working-directory: mobile
        run: flutter analyze
      - name: Run mobile tests
        working-directory: mobile
        run: flutter test
      - name: Install Android NDK with retry
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          package="ndk;28.2.13676358"
          for attempt in 1 2 3; do
            # sdkmanager can close stdin after accepting the needed license.
            # With pipefail enabled, `yes` then exits on SIGPIPE and falsely
            # marks a successful NDK install as failed. Capture sdkmanager's
            # exit code directly instead.
            set +o pipefail
            yes | "$SDKMANAGER" --install "$package"
            sdk_status=${PIPESTATUS[1]}
            set -o pipefail
            if [ "$sdk_status" -eq 0 ] && [ -d "${ANDROID_HOME}/ndk/28.2.13676358" ]; then
              echo "Android NDK 28.2.13676358 installed."
              exit 0
            fi
            echo "::warning::NDK installation attempt ${attempt} failed (sdkmanager exit: ${sdk_status}); retrying after a short delay."
            rm -rf "${ANDROID_HOME}/ndk/28.2.13676358"
            sleep $((attempt * 10))
          done
          echo "::error::Could not install Android NDK after 3 attempts."
          exit 1
      - name: Build installable debug APK
        working-directory: mobile
        run: flutter build apk --debug
      - name: Upload debug APK for device testing
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-mobile-android-debug
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 90

  ios-build-check:
    name: iOS no-code-sign build check
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate iOS host project
        working-directory: mobile
        run: python3 bootstrap_platforms.py
      - name: Resolve dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Analyze Dart source
        working-directory: mobile
        run: flutter analyze
      - name: Run mobile tests
        working-directory: mobile
        run: flutter test
      - name: Compile iOS app without signing
        working-directory: mobile
        run: flutter build ios --no-codesign
